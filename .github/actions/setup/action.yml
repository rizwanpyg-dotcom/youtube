name: Set up ytengine
description: Python, FFmpeg, pip and Kokoro model caches, and the pipeline database from the state branch.
inputs:
  models:
    description: Download the Kokoro TTS model files (needed only for rendering)
    default: "true"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
      with:
        python-version: "3.11"
        cache: pip
    - name: Install system packages
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq ffmpeg espeak-ng >/dev/null
        ffmpeg -hide_banner -version | head -1
    - name: Install Python packages
      shell: bash
      run: pip install -q -r requirements.txt
    - name: Cache Kokoro model
      if: inputs.models == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
      with:
        path: models
        key: kokoro-v1.0
    - name: Download Kokoro model (first run only)
      if: inputs.models == 'true'
      shell: bash
      run: |
        mkdir -p models
        base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
        [ -f models/kokoro-v1.0.onnx ] || curl -sSfL -o models/kokoro-v1.0.onnx "$base/kokoro-v1.0.onnx"
        [ -f models/voices-v1.0.bin ] || curl -sSfL -o models/voices-v1.0.bin "$base/voices-v1.0.bin"
        ls -la models
    - name: Pull pipeline state
      shell: bash
      run: bash scripts/state.sh pull
