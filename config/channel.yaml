# Channel configuration. Committed to the repo; contains NO secrets.
# Secrets come only from environment variables injected by GitHub Actions Secrets.

channel:
  name_working: "Fallen Markets"         # channel @fallenmarkets
  language: en
  audience: international, English-speaking, 18-45, curious about money/tech history
  niche: Economic History & Tech Collapses
  voice_of_brand: >
    Calm, precise, slightly wry documentary narrator. Explains causes, not just events.
    Never gives investment advice. Never sensationalises tragedy.

schedule:                  # all times UTC (PKT = UTC+5)
  long_form:
    per_week: 2
    publish_days: [TUE, FRI]
    publish_time: "14:00"  # 09:00 US Eastern / 19:00 PKT
    target_minutes: [9, 13]
  shorts:
    per_week: 2            # raise to 3 only after quality review
    publish_days: [MON, THU]
    publish_time: "16:00"
    max_seconds: 58
  production_lead_days: 3  # finish rendering at least 3 days before the slot

launch:
  publish_mode: package          # package -> review_window -> auto (each step needs owner approval)
  require_script_approval: true
  require_final_approval: true
  supervised_video_count: 15     # human approval stays on for at least this many videos

llm:
  # Tried in order. Every provider has a self-imposed daily cap below its free limit.
  # No Google Cloud billing account is ever linked, so paid usage can't happen.
  # Model ids checked against Google's model list on 2026-11-10 (all marked "Stable").
  # If Google retires them, the "auto" entry discovers a current Flash model for this key.
  providers:
    - name: gemini
      model: gemini-3.6-flash
      daily_request_cap: 200
    - name: gemini
      model: gemini-3.5-flash-lite
      daily_request_cap: 600
    - name: gemini
      model: gemini-3.1-flash-lite
      daily_request_cap: 600
    - name: gemini
      model: auto
      daily_request_cap: 200
  temperature_script: 0.8
  temperature_factual: 0.1

youtube:
  data_api_daily_cap_units: 8000        # provider default is 10,000; we keep a reserve
  category_id: "27"                     # Education
  default_privacy_until_audit: private
  search_calls_per_day: 15              # 100 units each

tts:
  engine: kokoro
  voice: am_michael                     # licence must be confirmed in VOICES.md before launch
  fallback_engine: piper
  speed: 0.97
  target_lufs: -14

video:
  long:  {width: 1920, height: 1080, fps: 30, crf: 20, preset: veryfast}
  short: {width: 1080, height: 1920, fps: 30, crf: 21, preset: veryfast}
  music_bed_db: -26
  captions: {long: sidecar_srt, short: burned_in}

brand:
  colors: {bg: "#111418", ink: "#F2EDE4", accent: "#E4572E", accent2: "#F2B134", grid: "#2A2F36"}
  fonts: {display: "Archivo Black (OFL)", body: "Inter (OFL)"}

quality:
  min_verified_claim_ratio: 1.0          # every factual sentence must cite a verified claim
  min_sources_per_claim: 2               # or 1 tier-1 primary source
  max_similarity_to_past_scripts: 0.20   # word-trigram Jaccard
  banned_phrases_file: config/banned_phrases.txt
  min_qc_score: 0.85

allowed_licenses: [PD, CC0, CC-BY-4.0, CC-BY-SA-4.0, CC-BY-3.0, CC-BY-SA-3.0, Apache-2.0, MIT, OFL-1.1, YT-Audio-Library, Original]

storage:
  keep_rendered_days: 0                  # runner disk is ephemeral; packages live as Actions artifacts
  artifact_retention_days: 14
  db_backup_keep_weekly: 12
